name = "gabriel-portfolio-analytics"
main = "worker.mjs"
compatibility_date = "2026-10-14"

[vars]
ALLOWED_ORIGIN = "https://gabrieldelvaje.github.io"

[[d1_databases]]
binding = "DB"
database_name = "portfolio-analytics"
# Replace with the ID returned by wrangler d1 create.
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "COLLECT_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
