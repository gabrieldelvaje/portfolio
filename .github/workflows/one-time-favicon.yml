name: Apply portfolio favicon
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-favicon.yml
permissions:
  contents: write
jobs:
  apply-favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace browser tab globe with developer emoji
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html')
          contents = html.read_text(encoding='utf-8')
          icon = '    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1" />\n'
          if 'rel="icon"' not in contents:
              anchor = '    <title>Gabriel Delvaje — Data Analytics</title>'
              if anchor not in contents:
                  raise RuntimeError('Cannot locate original title; index.html left unchanged')
              contents = contents.replace(anchor, icon + anchor, 1)
              html.write_text(contents, encoding='utf-8')
          Path('favicon.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text x="32" y="34" text-anchor="middle" dominant-baseline="central" font-size="50">👨‍💻</text></svg>\n''', encoding='utf-8')
          PY
          git rm -f .github/workflows/one-time-favicon.yml
          git add index.html favicon.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: use developer emoji for portfolio tab favicon'
          git push origin HEAD:main