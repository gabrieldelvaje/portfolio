name: Fix Sugar Cane Intelligence card navigation
on:
  push:
    paths:
      - '.github/workflows/fix-sugar-cane-card-route.yml'
permissions:
  contents: write
jobs:
  fix-card-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore internal project route
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          before = '<a class="project-card-link" href="https://gabrieldelvaje.github.io/sugar-cane-intelligence/" target="_blank" rel="noopener noreferrer" aria-label="Open Sugar Cane Intelligence application">'
          after = '<a class="project-card-link" href="#sugar-cane-intelligence" aria-label="Open Sugar Cane Intelligence application">'
          assert html.count(before) == 1, 'Unexpected project card state; aborting without changes'
          assert '<iframe class="project-embed" title="Sugar Cane Intelligence" src="https://gabrieldelvaje.github.io/sugar-cane-intelligence/"' in html, 'New embedded site URL is missing; aborting'
          path.write_text(html.replace(before, after, 1), encoding='utf-8')
          print('Restored card link to internal #sugar-cane-intelligence route; kept the new embedded site.')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: open Sugar Cane Intelligence within portfolio"
          git push